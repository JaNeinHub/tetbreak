<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12131b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TetBreak">
  <title>TetBreak</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    :root {
      /* Safe-area insets. The Android shell may override these with real pixel values. */
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --bg: #12131b;
      --card: #1e2030;
      --text: #f2f3f8;
      --muted: #9095ad;
      --accent: #ffc94d;
      --accent-text: #2a2008;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: radial-gradient(120% 70% at 50% 0%, #252840 0%, var(--bg) 65%) var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
      touch-action: none;
    }
    body { position: fixed; inset: 0; }
    #stage { position: fixed; inset: 0; display: block; touch-action: none; }
    #probe {
      position: fixed; visibility: hidden; pointer-events: none;
      padding: var(--sat) var(--sar) var(--sab) var(--sal);
    }
    .icon-btn {
      position: fixed; top: calc(var(--sat) + 10px); left: calc(var(--sal) + 12px);
      width: 44px; height: 44px; border-radius: 14px; border: 0;
      background: rgba(255,255,255,0.07); color: var(--text);
      display: grid; place-items: center; cursor: pointer;
    }
    .icon-btn:active { background: rgba(255,255,255,0.15); }
    .icon-btn svg { width: 22px; height: 22px; }
    .mode-btn {
      left: auto; right: calc(var(--sar) + 12px); width: auto; padding: 0 12px 0 10px;
      display: flex; align-items: center; gap: 7px;
      font: inherit; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .mode-btn svg { width: 18px; height: 18px; }
    .mode-btn .lvl { fill: currentColor; opacity: 0.25; }
    .mode-btn .lvl.on { fill: var(--accent); opacity: 1; }

    .overlay {
      position: fixed; inset: 0; display: grid; place-items: center;
      padding: 16px; background: rgba(8, 9, 14, 0.62);
      opacity: 0; pointer-events: none; transition: opacity 220ms ease;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .card {
      max-height: 100%; overflow-y: auto;
      width: min(340px, 100%); background: var(--card); border-radius: 22px;
      padding: 26px 22px 22px; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      transform: translateY(14px) scale(0.97); transition: transform 260ms cubic-bezier(.2,.9,.3,1.2);
    }
    .overlay.show .card { transform: none; }
    .card h2 { margin: 0 0 18px; font-size: 22px; font-weight: 700; }
    .card p { margin: 0 0 22px; color: var(--muted); font-size: 15px; line-height: 1.4; }
    .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; }
    .big { font-size: 52px; font-weight: 800; line-height: 1.1; margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
    .best-line { font-size: 17px; margin: 6px 0 24px; color: var(--muted); }
    .best-line b { color: var(--text); font-variant-numeric: tabular-nums; }
    .record {
      display: none; margin: 0 auto 8px; padding: 5px 12px; width: max-content;
      border-radius: 999px; background: var(--accent); color: var(--accent-text);
      font-weight: 800; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase;
    }
    .record.show { display: block; }
    .btn-row { display: flex; gap: 10px; }
    .btn {
      flex: 1; height: 52px; border: 0; border-radius: 16px; cursor: pointer;
      font: inherit; font-size: 17px; font-weight: 700;
      background: var(--accent); color: var(--accent-text);
    }
    .btn.secondary { background: rgba(255,255,255,0.08); color: var(--text); }
    .btn:active { filter: brightness(0.9); }
    .btn.narrow { flex: 0 0 96px; }

    /* mode dialog */
    .choice {
      display: block; width: 100%; margin: 0 0 10px; padding: 14px 16px; text-align: left;
      border: 2px solid transparent; border-radius: 16px; cursor: pointer;
      background: rgba(255,255,255,0.06); color: var(--text); font: inherit;
    }
    .choice:active { background: rgba(255,255,255,0.12); }
    .choice.current { border-color: var(--accent); }
    .choice .name { display: block; font-size: 18px; font-weight: 800; }
    .choice .desc { display: block; margin-top: 3px; color: var(--muted); font-size: 14px; line-height: 1.35; }
    .choice .rec { display: block; margin-top: 6px; font-size: 14px; color: #ffd877; }
    .choice .rec b { font-variant-numeric: tabular-nums; }
    #modeNote { margin: 4px 0 16px; font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="probe"></div>

  <button id="restartBtn" class="icon-btn" aria-label="Neues Spiel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/>
    </svg>
  </button>

  <button id="modeBtn" class="icon-btn mode-btn" aria-label="Spielmodus">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect class="lvl" x="3" y="14" width="5" height="7" rx="1.5"/>
      <rect class="lvl" x="9.5" y="9" width="5" height="12" rx="1.5"/>
      <rect class="lvl" x="16" y="3" width="5" height="18" rx="1.5"/>
    </svg>
    <span id="modeLabel">8×8</span>
  </button>

  <div id="gameOver" class="overlay" role="dialog" aria-modal="true">
    <div class="card">
      <h2>Keine Züge mehr</h2>
      <div class="record" id="goRecord">Neuer Rekord!</div>
      <div class="label">Punkte</div>
      <div class="big" id="goScore">0</div>
      <div class="best-line">Rekord <b id="goBest">0</b></div>
      <div class="btn-row">
        <button class="btn secondary narrow" id="goMode">Modus</button>
        <button class="btn" id="goPlay">Nochmal spielen</button>
      </div>
    </div>
  </div>

  <div id="confirm" class="overlay" role="dialog" aria-modal="true">
    <div class="card">
      <h2>Neues Spiel starten?</h2>
      <p>Dein aktueller Punktestand geht verloren.</p>
      <div class="btn-row">
        <button class="btn secondary" id="cfCancel">Abbrechen</button>
        <button class="btn" id="cfOk">Neues Spiel</button>
      </div>
    </div>
  </div>

  <div id="modeDlg" class="overlay" role="dialog" aria-modal="true">
    <div class="card">
      <h2>Spielmodus</h2>
      <button class="choice" data-mode="normal">
        <span class="name">Normal</span>
        <span class="desc">8×8 Felder, 3 Teile pro Runde, die bekannten Formen</span>
        <span class="rec">Rekord <b id="rec-normal">0</b></span>
      </button>
      <button class="choice" data-mode="advanced">
        <span class="name">Fortgeschritten</span>
        <span class="desc">10×10 Felder, 4 Teile pro Runde, mehr und kniffligere Formen</span>
        <span class="rec">Rekord <b id="rec-advanced">0</b></span>
      </button>
      <button class="choice" data-mode="hard">
        <span class="name">Schwer</span>
        <span class="desc">10×10 Felder, die schwierigsten Formen. Von 4 Teilen legst du 3, das vierte bleibt für die nächste Runde.</span>
        <span class="rec">Rekord <b id="rec-hard">0</b></span>
      </button>
      <p id="modeNote">Ein Moduswechsel beendet das laufende Spiel.</p>
      <div class="btn-row"><button class="btn secondary" id="modeCancel">Abbrechen</button></div>
    </div>
  </div>

  <script src="game-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
